name: senideog
channels:
  - bioconda
  - conda-forge
dependencies:
  - python>=3.10
  - pandas
  - matplotlib
  - codecarbon          # optional; enables carbon footprint tracking
  - orthofinder>=3.1.5
  # pinned: diamond>=2.1 crashes on the empty intermediate FASTA files
  # OrthoFinder legitimately produces (davidemms/OrthoFinder#984, open)
  - diamond=2.0.13
  - busco>=5
  - seqkit
  - agat
  - trimal
  - iqtree
  - astral-tree
  - cafe
  # treePL (divergence dating, needed for senideog_phylo.py) is not
  # packaged on bioconda/conda-forge -- build from source:
  # https://github.com/blackrim/treePL
